<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HariVision Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #05020c; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.2); }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">
    <!-- Auth Gateway Screen -->
    <div id="auth-panel" class="max-w-md mx-auto my-20 bg-[#0e071c] border border-purple-500/20 p-8 shadow-2xl">
        <h1 class="text-xl font-bold uppercase tracking-widest text-white mb-6 text-center">HariVision Admin</h1>
        <form id="login-form" class="flex flex-col gap-4">
            <div>
                <label class="text-[10px] uppercase font-bold text-purple-400 tracking-wider">Email</label>
                <input type="email" id="email" required class="w-full bg-[#05020c] border border-purple-500/20 px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-400">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-purple-400 tracking-wider">Password</label>
                <input type="password" id="password" required class="w-full bg-[#05020c] border border-purple-500/20 px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-400">
            </div>
            <button type="submit" class="bg-purple-700 hover:bg-purple-600 text-white font-bold text-xs uppercase tracking-widest py-3.5 mt-2 transition">Sign In</button>
            <p id="auth-error" class="text-xs text-red-400 hidden mt-2"></p>
        </form>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden max-w-6xl mx-auto flex flex-col gap-8">
        <!-- Header Controls -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-[#0e071c] border border-purple-500/20 p-6 gap-4">
            <div>
                <div class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">System Controller</div>
                <h1 class="text-2xl font-black text-white uppercase tracking-wider">HariVision Dashboard</h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="live-indicator" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/20">
                    <span class="w-2 h-2 rounded-full bg-red-500"></span> Closed
                </span>
                <button id="logout-btn" class="text-xs text-slate-400 hover:text-white uppercase font-bold">Logout</button>
            </div>
        </div>

        <!-- Controls Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Voting Controls -->
            <div class="bg-[#0e071c] border border-purple-500/20 p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-base font-bold text-white uppercase tracking-wider mb-4">Voting Lifecycle</h2>
                    <div id="timer-display" class="text-sm font-mono text-purple-300 mb-6">Voting ends in: --:--</div>
                    
                    <div id="open-controls" class="flex flex-col gap-3">
                        <label class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">Select Duration</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="openVoting(5)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">5 Min</button>
                            <button onclick="openVoting(10)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">10 Min</button>
                            <button onclick="openVoting(15)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">15 Min</button>
                            <button onclick="openVoting(20)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">20 Min</button>
                            <button onclick="openVoting(30)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">30 Min</button>
                            <button onclick="openVoting(0)" class="bg-[#15092b] hover:bg-purple-900 border border-purple-500/20 text-xs font-bold py-2 text-white">Unlimited</button>
                        </div>
                    </div>
                </div>

                <div id="close-controls" class="hidden mt-6">
                    <button onclick="closeVoting()" class="w-full bg-red-700 hover:bg-red-600 text-white font-extrabold text-xs uppercase tracking-widest py-4 transition">Close Voting Immediately</button>
                </div>
            </div>

            <!-- Stats Overview -->
            <div class="bg-[#0e071c] border border-purple-500/20 p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-base font-bold text-white uppercase tracking-wider mb-2">Live Participation</h2>
                    <div class="text-4xl font-black text-yellow-400 font-mono mb-4" id="vote-count">0</div>
                    <div id="toast-container" class="h-12 flex items-center">
                        <!-- Populated dynamically on new vote -->
                    </div>
                </div>
                <button id="reveal-btn" onclick="revealResults()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-extrabold text-xs uppercase tracking-widest py-4 transition">Reveal Results</button>
            </div>
        </div>

        <!-- Real-time Score Breakdown Table -->
        <div class="bg-[#0e071c] border border-purple-500/20 p-6 overflow-x-auto">
            <h2 class="text-base font-bold text-white uppercase tracking-wider mb-4">Live Score Matrix</h2>
            <table class="w-full text-left text-xs font-mono">
                <thead>
                    <tr class="border-b border-purple-500/20 text-purple-400">
                        <th class="pb-3">Performance</th>
                        <th class="pb-3">12</th>
                        <th class="pb-3">10</th>
                        <th class="pb-3">8</th>
                        <th class="pb-3">7</th>
                        <th class="pb-3">6</th>
                        <th class="pb-3">5</th>
                        <th class="pb-3">4</th>
                        <th class="pb-3">3</th>
                        <th class="pb-3 font-bold text-white">Total</th>
                    </tr>
                </thead>
                <tbody id="matrix-body" class="divide-y divide-purple-500/10 text-slate-300">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
