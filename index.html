<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HariVision Performance Contest | August 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #05020c; color: #f8fafc; overflow-x: hidden; }
        .page-fade { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .heart-poly { filter: drop-shadow(0 2px 5px rgba(244, 63, 94, 0.4)); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.2); }
    </style>
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center p-4 md:p-8 select-none">
    <canvas id="bg-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <main class="relative z-10 w-full max-w-3xl mx-auto flex flex-col justify-between flex-grow my-auto">
        <section id="app-card" class="w-full my-4 bg-[#0e071c]/70 backdrop-blur-3xl rounded-none p-6 md:p-10 border border-purple-500/10 shadow-[0_40px_100px_rgba(0,0,0,0.95)] min-h-[580px] flex flex-col justify-between transition-all duration-500 page-fade">
            <!-- Dynamically populated via app.js based on Firebase State -->
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
